{% extends "layout/base/base.html" %}

{% block content %}
<div class="container text-center mt-5 pt-5 min-vh-100">
    <div class="card shadow p-5 mx-auto" style="max-width: 600px; border-radius: 20px;">
        <div class="text-success mb-3">
            <i class="fas fa-check-circle fa-5x"></i>
        </div>
        <h2 class="fw-bold text-success">Thanh toán thành công!</h2>
        <p class="fs-5 text-muted">Cảm ơn bạn đã đặt hàng tại Cafe Shop.</p>
        
        <div class="border-top pt-3 mt-3 text-start">
            <div class="d-flex justify-content-between mb-2">
                <span>Mã đơn hàng:</span>
                <span class="fw-bold">#{{ order.id }}</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span>Phương thức:</span>
                <span class="fw-bold">Ví MoMo</span>
            </div>
            <div class="d-flex justify-content-between fs-5">
                <span>Tổng tiền:</span>
                <span class="fw-bold text-danger">{{ "{:,.0f}".format(order.total_amount * (1+service_fee)) }} VND</span>
            </div>
        </div>

        <div class="mt-4">
            <a href="{{ url_for('main.menu') }}" class="btn btn-dark w-100 py-2 fw-bold" style="border-radius: 12px;">
                Tiếp tục mua hàng
            </a>
        </div>
    </div>
</div>
{% endblock %}
