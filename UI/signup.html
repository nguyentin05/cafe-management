<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="D:\test html\css\style.css"> 
</head>
<body>

    <div class="signup-container">
                <div class="signup-form-section">
            <div class="signup-content-wrapper">
                <h1 class="welcome-heading">Get Started Now</h1> 
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label> 
                        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>

                    <div class="mb-4 form-check"> 
                        <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                        <label class="form-check-label" for="agreeTerms">I agree to the terms & policy</label>
                    </div>

                    <button type="submit" class="btn btn-signup w-100 mb-3">Signup</button> 
                </form>

                <div class="separator mb-3">
                    <span class="or-text">Or</span>
                </div>

                <div class="social-signup-buttons">
                    <button class="btn btn-outline-secondary w-100 mb-2">
                        <img src="https://img.icons8.com/color/16/000000/google-logo.png" alt="Google icon" class="me-2">
                        Sign in with Google
                    </button>
                    <button class="btn btn-outline-secondary w-100">
                        <i class="fab fa-apple me-2"></i>
                        Sign in with Apple
                    </button>
                </div>

                <p class="login-text mt-4">
                    Have an account? <a href="#" class="login-link">Sign In</a> 
                </p>
            </div>
        </div>
                <div class="signup-image-section">
            </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
