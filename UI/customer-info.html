<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&family=Roboto:wght@400;500&display=swap">
    <link rel="stylesheet" href=" D:\test html\css\style.css">
</head>
<body class="bg-light-beige">
    <div class="main-dashboard-container">
        <div class="card profile-overview-card">
            <div class="card-header user-summary-section primary-bg">
                <div class="d-flex align-items-center flex-grow-1">
                    <img src="image/avatar.jpg" alt="Avatar" class="profile-avatar me-3">
                    <div>
                        <h5 class="mb-0 user-name">Your name</h5>
                        <p class="mb-0 user-email">yourname@gmail.com</p>
                    </div>
                </div>
            </div>
            
            <div class="card-body navigation-section">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item my-profile-active-button-wrapper">
                        <a href="#customer-info-section" class="nav-link-item my-profile-active-button">
                            <i class="fas fa-user-circle me-3"></i> My Profile
                        </a>
                    </li>
                    
                    <li class="list-group-item">
                        <a href="#" class="nav-link-item edit-info-link">
                            <i class="fas fa-pencil-alt nav-icon me-3"></i> Chỉnh sửa thông tin
                        </a>
                    </li>
                    
                    <li class="list-group-item">
                        <a href="#" class="nav-link-item logout-link">
                            <i class="fas fa-sign-out-alt nav-icon me-3"></i> Log Out
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="card customer-info-card" id="customer-info-section">
            <div class="card-header d-flex justify-content-between align-items-center"> 
                <h4 class="info-header-title">CUSTOMER INFORMATION</h4> 
                <button type="button" class="btn-close" aria-label="Close" onclick="window.location.href='dashboard.html';"></button>
            </div>
            
            <div class="card-body">
                <form>
                    <div class="info-item mb-3">
                        <label class="form-label">Name</label>
                        <p class="info-value">Your name</p>
                    </div>

                    <div class="info-item mb-3">
                        <label class="form-label">Email account</label>
                        <p class="info-value">yourname@gmail.com</p>
                    </div>

                    <div class="info-item mb-3">
                        <label class="form-label">Mobile number</label>
                        <p class="info-value text-muted">Add number</p>
                    </div>

                    <div class="info-item mb-3">
                        <label class="form-label">Joined Date</label>
                        <p class="info-value">January 1, 2023</p>
                    </div>

                    <div class="info-item mb-4">
                        <label class="form-label">Location</label>
                        <p class="info-value">USA</p>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
