<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="D:\test html\css\style.css">
</head>
<body>

    <div class="login-container">
                <div class="login-form-section">
            <div class="login-content-wrapper">
                <h1 class="welcome-heading">Welcome back!</h1>
                <p class="welcome-subtext">Enter your Credentials to access your account</p>

                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label mb-0">Password</label>
                            <a href="#" class="forgot-password-link">Forgot password</a>
                        </div>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-login w-100 mb-3">Login</button>
                </form>

                <div class="separator mb-3">
                    <span class="or-text">Or</span>
                </div>

                <div class="social-login-buttons">
                    <button class="btn btn-outline-secondary w-100 mb-2">
                        <img src="https://img.icons8.com/color/16/000000/google-logo.png" alt="Google icon" class="me-2">
                        Sign in with Google
                    </button>
                    <button class="btn btn-outline-secondary w-100">
                        <i class="fab fa-apple me-2"></i>
                        Sign in with Apple
                    </button>
                </div>

                <p class="signup-text mt-4">
                    Don't have an account? <a href="#" class="signup-link">Sign Up</a>
                </p>
            </div>
        </div>
        
        <div class="login-image-section">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
